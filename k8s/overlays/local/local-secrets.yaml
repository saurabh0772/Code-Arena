# ==============================================================================
# Local Kubernetes Demonstration Secret
# ==============================================================================
# FOR LOCAL DEVELOPMENT AND TEST CLUSTERS ONLY (Minikube / kind).
# Provides non-sensitive local defaults for in-cluster MongoDB and Redis demo.
# Never commit real credentials to production repositories.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: codearena-secrets
  namespace: codearena
  labels:
    app.kubernetes.io/name: codearena
    app.kubernetes.io/part-of: codearena
type: Opaque
stringData:
  JWT_SECRET: "local-dev-cluster-secret-key-minimum-32-chars-ok!"
  MONGODB_URI: "mongodb://mongodb:27017/codearena"
  REDIS_PASSWORD: ""
