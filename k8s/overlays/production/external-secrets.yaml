# ==============================================================================
# Production Secrets Management Reference: External Secrets Operator (ESO)
# ==============================================================================
# In production, credentials (JWT secret, MongoDB Atlas URI, ElastiCache password)
# are never committed to Git or stored in raw static manifests.
#
# The External Secrets Operator synchronizes the 'codearena-secrets' Secret directly
# from an approved cloud vault (AWS Secrets Manager, GCP Secret Manager, or HashiCorp Vault).
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: codearena-secrets-sync
  namespace: codearena
  labels:
    app.kubernetes.io/name: codearena
    app.kubernetes.io/part-of: codearena
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: production-cloud-secret-store
    kind: ClusterSecretStore
  target:
    name: codearena-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: production/codearena/app
        property: JWT_SECRET
    - secretKey: MONGODB_URI
      remoteRef:
        key: production/codearena/mongodb-atlas
        property: MONGODB_URI # e.g. mongodb+srv://codearena_admin:<vault-password>@prod-cluster.mongodb.net/codearena?retryWrites=true&w=majority
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: production/codearena/elasticache
        property: REDIS_PASSWORD
