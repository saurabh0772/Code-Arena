apiVersion: v1
kind: ConfigMap
metadata:
  name: codearena-config
  namespace: codearena
data:
  NODE_ENV: "production"
  PORT: "5000"
  CORS_ORIGIN: "https://codearena.example.com"
  # Production Datastore Topology: Approved Managed Cloud Redis Endpoint
  REDIS_HOST: "managed-redis.prod.cache.internal"
  REDIS_PORT: "6379"
  WORKER_CONCURRENCY: "4"
  WORKER_HEARTBEAT_INTERVAL_MS: "5000"
  WORKER_GRACEFUL_SHUTDOWN_TIMEOUT_MS: "30000"
  CODEARENA_WORKSPACE_BASE: "/tmp/codearena-workspaces"
  CODEARENA_SANDBOX_IMAGE: "ghcr.io/saurabh0772/codearena-sandbox:v1.0.0"
