apiVersion: apps/v1
kind: Deployment
metadata:
  name: codearena-frontend
  namespace: codearena
  labels:
    app: codearena-frontend
    app.kubernetes.io/name: codearena-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: codearena
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: codearena-frontend
      tier: frontend
  template:
    metadata:
      labels:
        app: codearena-frontend
        app.kubernetes.io/name: codearena-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: codearena
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: codearena-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
