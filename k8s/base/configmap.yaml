apiVersion: v1
kind: ConfigMap
metadata:
  name: codearena-config
  namespace: codearena
  labels:
    app.kubernetes.io/name: codearena
    app.kubernetes.io/part-of: codearena
data:
  NODE_ENV: "production"
  PORT: "5000"
  CORS_ORIGIN: "http://localhost:5173,http://localhost:80,http://127.0.0.1:5173"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  WORKER_CONCURRENCY: "2"
  WORKER_HEARTBEAT_INTERVAL_MS: "5000"
  WORKER_GRACEFUL_SHUTDOWN_TIMEOUT_MS: "10000"
  CODEARENA_WORKSPACE_BASE: "/tmp/codearena-workspaces"
  CODEARENA_SANDBOX_IMAGE: "codearena-sandbox:v1"
