apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codearena-ingress
  namespace: codearena
  labels:
    app.kubernetes.io/name: codearena-ingress
    app.kubernetes.io/part-of: codearena
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  tls:
    - hosts:
        - codearena.example.com
      secretName: codearena-tls-cert
  rules:
    - host: codearena.example.com
      http:
        paths:
          # Route API endpoints and probes to the Backend API Service
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: codearena-backend
                port:
                  number: 5000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: codearena-backend
                port:
                  number: 5000
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: codearena-backend
                port:
                  number: 5000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: codearena-backend
                port:
                  number: 5000
          # Route frontend SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codearena-frontend
                port:
                  number: 80
