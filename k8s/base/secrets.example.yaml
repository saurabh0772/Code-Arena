# ==============================================================================
# CodeArena Kubernetes Secrets Template (DO NOT COMMIT REAL SECRETS)
# ==============================================================================
# WARNING: Base64 encoding is NOT encryption.
# Copy this file to secrets.yaml (which is git-ignored) and populate with
# real base64-encoded secrets, or preferably integrate with a Secret Operator
# (e.g. External Secrets Operator with AWS Secrets Manager / HashiCorp Vault).
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: codearena-secrets
  namespace: codearena
  labels:
    app.kubernetes.io/name: codearena
    app.kubernetes.io/part-of: codearena
type: Opaque
stringData:
  JWT_SECRET: "replace-with-a-secure-random-secret-at-least-32-chars-long!"
  MONGODB_URI: "mongodb://mongodb:27017/codearena"
  REDIS_PASSWORD: ""
