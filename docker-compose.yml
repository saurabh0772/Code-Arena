services:
  # Phase 16: Reverse Proxy / Load Balancer — routes host traffic across horizontally scaled backend replicas
  reverse-proxy:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "5000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      reverse-proxy:
        condition: service_started
      backend:
        condition: service_healthy

  # Phase 16: Horizontally Scalable Backend API — can be scaled via `docker compose up --scale backend=N`
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - API_INSTANCE_ID=${API_INSTANCE_ID:-}
      - MONGODB_URI=mongodb://mongodb:27017/codearena
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - CORS_ORIGIN=http://localhost:5173,http://localhost:80,http://127.0.0.1:5173,http://localhost:5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # Phase 17: Distributed Worker Architecture — can be scaled dynamically via `docker compose up --scale worker=N`
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "src/workers/submission.worker.js"]
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/codearena
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      # If WORKER_ID is unset, each scaled container automatically derives a unique collision-resistant identity
      - WORKER_ID=${WORKER_ID:-}
      - WORKER_HEARTBEAT_INTERVAL_MS=${WORKER_HEARTBEAT_INTERVAL_MS:-5000}
      - WORKER_GRACEFUL_SHUTDOWN_TIMEOUT_MS=${WORKER_GRACEFUL_SHUTDOWN_TIMEOUT_MS:-10000}
      - CODEARENA_WORKSPACE_BASE=${CODEARENA_WORKSPACE_BASE:-/tmp/codearena-workspaces}
      - CODEARENA_SANDBOX_IMAGE=codearena-sandbox:v1
    volumes:
      # Trusted infrastructure boundary: Worker requires Docker socket access to launch sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared DooD execution workspace
      - ${CODEARENA_HOST_WORKSPACE_DIR:-/tmp/codearena-workspaces}:${CODEARENA_WORKSPACE_BASE:-/tmp/codearena-workspaces}:rw
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    expose:
      - "6379"
    ports:
      # Bound strictly to 127.0.0.1; defaults to 6380 on host to prevent conflicts if host runs redis-server
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    expose:
      - "27017"
    ports:
      # Bound strictly to 127.0.0.1 for local development; never exposed to 0.0.0.0
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_DATABASE=codearena
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data:
