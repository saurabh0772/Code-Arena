# CodeArena Phase 16: Reverse Proxy & Load Balancer Configuration
# Routes incoming traffic across horizontally scaled backend replicas (backend:5000)

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                      'upstream="$upstream_addr"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Embedded Docker DNS resolver with short TTL to dynamically pick up scaled replicas.
    # Using a variable in proxy_pass forces Nginx to query this resolver at runtime,
    # enabling dynamic discovery of all backend container IPs returned by Docker DNS.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    server {
        listen 80;
        server_name localhost;

        # Standard payload limit matching backend limits
        client_max_body_size 10m;

        # Gateway health check (verifies Nginx reverse proxy process is up)
        location /proxy-health {
            default_type application/json;
            return 200 '{"status":"ok","service":"codearena-reverse-proxy"}';
        }

        # Health probe routed to backend cluster (lightweight process liveness)
        location /health {
            set $backend_upstream "http://backend:5000";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $http_x_request_id;

            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # Readiness probe routed to backend cluster (deep dependency readiness: DB + Redis)
        location /ready {
            set $backend_upstream "http://backend:5000";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $http_x_request_id;

            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # API routing across backend replicas
        location /api/ {
            set $backend_upstream "http://backend:5000";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header Connection "";

            # Health-aware failover: try next upstream if current replica fails
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # Swagger Docs routing
        location /api/v1/docs {
            set $backend_upstream "http://backend:5000";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $http_x_request_id;
        }

        # Default catch-all routing to backend cluster
        location / {
            set $backend_upstream "http://backend:5000";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $http_x_request_id;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
    }
}
